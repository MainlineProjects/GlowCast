name: Private Drive Semantic Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate read-only Drive service account
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify required benchmark bridge configuration
        shell: bash
        env:
          GLOWCAST_PRODUCTION_ANALYZE_URL: ${{ secrets.GLOWCAST_PRODUCTION_ANALYZE_URL }}
        run: |
          set -euo pipefail
          test -n "${GLOWCAST_PRODUCTION_ANALYZE_URL:-}" || {
            echo 'Missing secret GLOWCAST_PRODUCTION_ANALYZE_URL' >&2
            exit 2
          }
          gcloud auth print-access-token >/dev/null

      - name: Run all 24 private Drive images through production semantic endpoint
        shell: bash
        env:
          GLOWCAST_REFERENCE_FOLDER_ID: 154_ygM9h5WUEI_HfRPW6FqkCM5ILh5Z6
          GLOWCAST_PRODUCTION_ANALYZE_URL: ${{ secrets.GLOWCAST_PRODUCTION_ANALYZE_URL }}
        run: |
          set -euo pipefail
          export GOOGLE_OAUTH_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          node scripts/run-private-drive-semantic-benchmark.mjs

      - name: Upload bridge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-semantic-benchmark-${{ github.sha }}
          path: private-benchmark-evidence/
          if-no-files-found: warn
          retention-days: 3
