name: Private Drive Semantic Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/private-drive-semantic-benchmark.yml'
      - 'scripts/run-private-drive-grounded-sam2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Verify private Drive authorization is configured
        shell: bash
        env:
          GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          mkdir -p private-benchmark-evidence
          if [ -z "${GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON:-}" ]; then
            cat > private-benchmark-evidence/00-BRIDGE-STATUS.json <<'JSON'
          {
            "status": "BLOCKED_NOT_EXECUTED",
            "actual_benchmark_overlays": 0,
            "missing_actions_secrets": ["GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON"],
            "production_url_required": false,
            "semantic_provider_secret_required": false,
            "next_action": "Authorize this workflow read-only access to the private Reference Images folder."
          }
          JSON
            echo "BLOCKED_NOT_EXECUTED: missing GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON" >&2
            exit 2
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Hugging Face model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: glowcast-grounded-sam2-v1-${{ runner.os }}

      - name: Install CPU inference runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'transformers>=5.5.4,<6' pillow requests timm accelerate google-auth

      - name: Run all 24 private Drive images through local Grounding DINO plus SAM2
        shell: bash
        env:
          GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON }}
          GLOWCAST_REFERENCE_FOLDER_ID: 154_ygM9h5WUEI_HfRPW6FqkCM5ILh5Z6
          GLOWCAST_DINO_MODEL: IDEA-Research/grounding-dino-tiny
          GLOWCAST_SAM2_MODEL: facebook/sam2.1-hiera-tiny
          GLOWCAST_MAX_WINDOW_AREA: '0.40'
        run: |
          set -euo pipefail
          python scripts/run-private-drive-grounded-sam2.py
          test -f private-benchmark-evidence/00-SUMMARY-CONTACT-SHEET.png
          test -f private-benchmark-evidence/00-RUN-SCORECARD.json
          test "$(find private-benchmark-evidence -maxdepth 1 -name '*-overlay.png' | wc -l)" -eq 24

      - name: Publish all visual evidence to Drive and prune results older than 24 hours
        shell: bash
        env:
          GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON }}
          GLOWCAST_RESULTS_FOLDER_ID: 1ZkA98n7hzKqMbmITXtkPAUhVyQfU5tvJ
          GLOWCAST_RUN_ID: ${{ github.run_id }}
          GLOWCAST_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime, json, mimetypes, os
          from pathlib import Path
          import requests
          from google.auth.transport.requests import Request
          from google.oauth2 import service_account

          raw = os.environ['GLOWCAST_GDRIVE_SERVICE_ACCOUNT_JSON']
          parent = os.environ['GLOWCAST_RESULTS_FOLDER_ID']
          run_id = os.environ['GLOWCAST_RUN_ID']
          sha = os.environ['GLOWCAST_HEAD_SHA'][:7]
          creds = service_account.Credentials.from_service_account_info(
              json.loads(raw), scopes=['https://www.googleapis.com/auth/drive']
          )
          creds.refresh(Request())
          session = requests.Session()
          session.headers['Authorization'] = f'Bearer {creds.token}'

          def api(method, url, **kwargs):
              r = session.request(method, url, timeout=120, **kwargs)
              r.raise_for_status()
              return r

          cutoff = (datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=24)).isoformat().replace('+00:00', 'Z')
          q = f"'{parent}' in parents and trashed = false and modifiedTime < '{cutoff}'"
          params = {'q': q, 'pageSize': 1000, 'fields': 'files(id,name,mimeType,modifiedTime)'}
          stale = api('GET', 'https://www.googleapis.com/drive/v3/files', params=params).json().get('files', [])
          deleted = 0
          for item in stale:
              api('DELETE', f"https://www.googleapis.com/drive/v3/files/{item['id']}")
              deleted += 1

          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d_%H-%M')
          folder_meta = {'name': f'{now}_run-{run_id}_{sha}', 'mimeType': 'application/vnd.google-apps.folder', 'parents': [parent]}
          run_folder = api('POST', 'https://www.googleapis.com/drive/v3/files', params={'fields': 'id,name'}, json=folder_meta).json()
          run_folder_id = run_folder['id']

          evidence = Path('private-benchmark-evidence')
          overlays = sorted(evidence.glob('*-overlay.png'))
          required = overlays + [evidence / '00-SUMMARY-CONTACT-SHEET.png', evidence / '00-RUN-SCORECARD.json']
          if len(overlays) != 24 or any(not p.exists() for p in required):
              raise RuntimeError(f'Expected 24 overlays plus contact sheet and scorecard, got overlays={len(overlays)}')

          uploaded = 0
          for path in required:
              mime = mimetypes.guess_type(path.name)[0] or 'application/octet-stream'
              meta = {'name': path.name, 'parents': [run_folder_id]}
              created = api('POST', 'https://www.googleapis.com/drive/v3/files', params={'fields': 'id'}, json=meta).json()
              with path.open('rb') as fh:
                  api('PATCH', f"https://www.googleapis.com/upload/drive/v3/files/{created['id']}", params={'uploadType': 'media'}, data=fh, headers={'Content-Type': mime})
              uploaded += 1

          children_q = f"'{run_folder_id}' in parents and trashed = false"
          children = api('GET', 'https://www.googleapis.com/drive/v3/files', params={'q': children_q, 'pageSize': 1000, 'fields': 'files(id,name,mimeType)'}).json().get('files', [])
          names = {x['name'] for x in children}
          expected_names = {p.name for p in required}
          if len(children) != 26 or names != expected_names:
              raise RuntimeError(f'Drive evidence verification failed: expected 26 exact files, found {len(children)}')
          print(json.dumps({'drive_run_folder_id': run_folder_id, 'published_files': uploaded, 'deleted_older_than_24h': deleted}, indent=2))
          PY

      - name: Upload full benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-drive-grounded-sam2-${{ github.sha }}
          path: private-benchmark-evidence/
          if-no-files-found: warn
          retention-days: 3
